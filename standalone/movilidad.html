<style>:root{--acc:#2f6bff;--hi:#9db9ff;--acc-t:#fff;--bgA:#050b1e;--bgB:#0d2260;--tx:#eef3ff;--mu:#93a3c6;--ln:rgba(255,255,255,.09);--ok:#37d39a;
--sf:color-mix(in srgb,var(--acc) 7%,#0a0f1c);--sf2:color-mix(in srgb,var(--acc) 13%,#0a0f1c);--bg:var(--bgA);
--disp:"BC","Barlow Condensed","Arial Narrow",Impact,sans-serif;--body:"IN","Inter","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bgA);color:var(--tx);font:15px/1.45 var(--body);-webkit-user-select:none;user-select:none}
body{display:flex;flex-direction:column;background:radial-gradient(1200px 760px at 28% -8%,color-mix(in srgb,var(--acc) 34%,var(--bgB)) 0%,var(--bgB) 38%,var(--bgA) 78%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,summary:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
/* barra superior */
#top{display:flex;align-items:center;gap:14px;padding:9px 18px;padding-top:max(9px,env(safe-area-inset-top));background:linear-gradient(180deg,rgba(0,0,0,.42),rgba(0,0,0,.18));backdrop-filter:blur(12px);z-index:5}
#badge{width:38px;height:38px;border-radius:11px;background:linear-gradient(150deg,color-mix(in srgb,var(--acc) 85%,#fff),var(--acc));color:var(--acc-t);display:grid;place-items:center;flex:none;box-shadow:0 4px 18px color-mix(in srgb,var(--acc) 55%,transparent)}
#badge svg{width:22px;height:22px}
.ttl{min-width:0;flex:1}.ttl b{display:block;font:800 24px/1 var(--disp);letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ttl small{color:var(--mu);font-size:12px}
.tools{display:flex;gap:6px;flex:none}
.pill{padding:7px 12px;border:1px solid var(--ln);border-radius:999px;background:rgba(255,255,255,.04);color:var(--mu);font-size:12.5px;font-weight:600;white-space:nowrap;transition:background .15s,color .15s}
.pill:hover{background:rgba(255,255,255,.09);color:var(--tx)}
.pill.on{color:var(--tx);background:color-mix(in srgb,var(--acc) 26%,transparent);border-color:color-mix(in srgb,var(--acc) 70%,transparent)}
.pill:active{transform:scale(.97)}
#bar{height:4px;background:rgba(255,255,255,.07);z-index:5}#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),var(--hi));box-shadow:0 0 14px var(--acc);transition:width .5s}
/* escenario */
#main{flex:1;display:flex;min-height:0}
#stage{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden}
#stage:before{content:"";position:absolute;inset:0;background:radial-gradient(46% 42% at 18% -6%,color-mix(in srgb,var(--hi) 34%,transparent),transparent 72%),radial-gradient(40% 38% at 86% -8%,color-mix(in srgb,var(--acc) 40%,transparent),transparent 74%),radial-gradient(70% 40% at 50% 112%,color-mix(in srgb,var(--acc) 20%,transparent),transparent 70%);pointer-events:none}
#stage:after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.5) 100%);pointer-events:none;z-index:1}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
#panel{width:400px;flex:none;background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 8%,rgba(8,12,22,.94)),rgba(6,9,16,.96));border-left:1px solid color-mix(in srgb,var(--acc) 35%,transparent);box-shadow:-18px 0 50px rgba(0,0,0,.35);padding:20px 22px;padding-bottom:max(18px,env(safe-area-inset-bottom));overflow:hidden;display:flex;flex-direction:column;gap:12px;position:relative;z-index:2}
body[data-screen=setup] #panel,body[data-screen=end] #panel{visibility:hidden}
.eyebrow{font-size:13px;color:var(--mu);font-weight:600}
h2{font:800 42px/.95 var(--disp);letter-spacing:.005em;text-wrap:balance}
#pMus{cursor:pointer;font-family:inherit;text-align:left;color:#fff;border-color:color-mix(in srgb,var(--musc) 75%,transparent);background:color-mix(in srgb,var(--musc) 24%,transparent)}#pMus.off{opacity:.45;text-decoration:line-through}
.chip{align-self:flex-start;padding:4px 12px;border-radius:999px;border:1px solid color-mix(in srgb,var(--acc) 60%,transparent);color:var(--hi);background:color-mix(in srgb,var(--acc) 16%,transparent);font-size:12.5px;font-weight:600}
.cues{list-style:none;display:flex;flex-direction:column;gap:8px}
.cues li{position:relative;padding-left:20px;font-size:14.5px;color:#d3dcee}

.ringw circle{fill:none;stroke-width:7}

#tNum{position:absolute;inset:0;display:grid;place-items:center;font:800 62px/1 var(--disp);font-variant-numeric:tabular-nums}
#tNum.sm2{font-size:38px}
.tinfo{display:flex;flex-direction:column;gap:7px}
#tLab{font-size:13px;color:var(--mu);font-weight:600}
#dots{display:flex;gap:6px}#dots i{width:24px;height:6px;border-radius:4px;background:rgba(255,255,255,.1)}#dots i.on{background:var(--acc)}#dots i.cur{background:var(--acc);animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.35}}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.btn{padding:14px 20px;border-radius:14px;background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 82%,#fff),var(--acc));color:var(--acc-t);font:800 20px/1 var(--disp);letter-spacing:.06em;text-transform:uppercase;box-shadow:0 8px 26px color-mix(in srgb,var(--acc) 38%,transparent),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .12s,filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn.ghost{background:rgba(255,255,255,.05);color:var(--tx);border:1px solid var(--ln);box-shadow:none}
.btn:disabled{opacity:.3;cursor:default}.btn:active:not(:disabled){transform:translateY(1px) scale(.99)}
#mainBtn{flex:1;min-width:0;padding:16px 12px}
.btn.sq{width:54px;font-size:26px;padding:10px 0}
#panel>*{flex-shrink:0}#pInfo{flex:1 1 auto;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;scrollbar-width:thin}#pInfo>*{flex-shrink:0}#pCtl{flex:none;display:flex;flex-direction:column;gap:11px;padding-top:10px;border-top:1px solid var(--ln)}
.sm{display:none}
#skipBtn{align-self:flex-start;margin-top:2px}
#steps{display:flex;gap:6px}
#steps button{flex:1;height:36px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--ln);color:var(--mu);font:700 17px var(--disp)}
#steps button.cur{border-color:var(--acc);color:#fff;background:color-mix(in srgb,var(--acc) 40%,transparent)}
#steps button.ok:not(.cur){color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
#pLevels{display:flex;gap:6px}#pLevels button{flex:1;height:38px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--ln);color:var(--mu);font:800 20px var(--disp);transition:background .15s}
#pLevels button.on{border-color:var(--acc);color:var(--acc-t);background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 80%,#fff),var(--acc));box-shadow:0 4px 16px color-mix(in srgb,var(--acc) 45%,transparent)}
#pLevels button.ok:not(.on){color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 10%,transparent)}#pLevels button:disabled{opacity:.55;cursor:default}
#pLvT{font-size:15.5px;color:#e3eaf7}#pLvT b{font:800 22px var(--disp);color:var(--hi);margin-right:2px}
#pSpec{display:inline-block;align-self:flex-start;font-size:13px;font-weight:700;padding:7px 12px;border-radius:10px;background:color-mix(in srgb,var(--acc) 13%,transparent);border-left:3px solid var(--acc);color:#e3eaf7}

#pKey li,#pErr li{padding-left:16px;position:relative}#pKey li:before{content:"✓";position:absolute;left:0;color:var(--ok);font-size:12px;top:1px}#pErr li:before{content:"✕";position:absolute;left:0;color:#ff7b7b;font-size:11px;top:2px}
#pErrBox summary{cursor:pointer;font-size:13px;color:var(--mu);font-weight:700;margin-bottom:7px}#pErrBox[open] summary{color:var(--tx)}

#alert.acc{background:linear-gradient(var(--acc),color-mix(in srgb,var(--acc) 65%,#000));color:var(--acc-t)}
#cd{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font:800 clamp(110px,28vw,260px)/1 var(--disp);color:#fff;opacity:0;text-shadow:0 0 60px var(--acc),0 6px 40px rgba(0,0,0,.6);z-index:2}

@keyframes cd{0%{opacity:0;transform:scale(1.5)}20%{opacity:1}100%{opacity:0;transform:scale(.85)}}

#toast.on{opacity:1;transform:translate(-50%,0)}
.hint{position:absolute;left:16px;bottom:13px;font-size:12px;color:rgba(255,255,255,.45);z-index:2;pointer-events:none}
/* pantallas de inicio y final */
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:radial-gradient(900px 600px at 20% 0%,color-mix(in srgb,var(--acc) 38%,var(--bgB)),var(--bgA) 75%)}
.ov.on{display:flex}
.card{position:relative;width:min(1020px,100%);max-height:94vh;overflow:auto;border-radius:26px;padding:34px;display:grid;grid-template-columns:1.05fr 1fr;gap:34px;background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 12%,rgba(8,12,22,.9)),rgba(6,9,16,.92));border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);box-shadow:0 40px 100px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.03) inset;scrollbar-width:thin}

.card h1{font:800 clamp(44px,6.4vw,72px)/.88 var(--disp);letter-spacing:.005em;margin-bottom:12px;text-wrap:balance}
.card .sub{color:var(--hi);font-size:15px;font-weight:600;margin-bottom:22px}
.fld{margin-bottom:14px}.fld label{display:block;font-size:13px;color:var(--mu);font-weight:600;margin-bottom:7px}
.seg{display:flex;gap:6px}.seg button{flex:1;padding:10px 6px;border-radius:11px;border:1px solid var(--ln);background:rgba(255,255,255,.04);color:var(--mu);font:800 19px var(--disp)}
.seg button.on{border-color:var(--acc);color:var(--acc-t);background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 80%,#fff),var(--acc))}
#exList{list-style:none;display:flex;flex-direction:column;gap:7px;counter-reset:ex}
#exList li{display:flex;align-items:center;gap:13px;padding:10px 13px;border:1px solid var(--ln);border-radius:14px;background:rgba(255,255,255,.035)}
#exList b{width:32px;height:32px;border-radius:10px;background:color-mix(in srgb,var(--acc) 26%,transparent);border:1px solid color-mix(in srgb,var(--acc) 70%,transparent);display:grid;place-items:center;font:800 18px var(--disp);flex:none;color:var(--hi)}
#exList div{flex:1;min-width:0}#exList span{display:block;font:800 21px/1.05 var(--disp);letter-spacing:.01em}#exList small{display:block;color:var(--mu);font-size:12.5px}#exList small.lab{color:#7686a6;margin-top:1px}
.lvc{display:flex;gap:4px;flex:none!important}.lvc button{width:28px;height:28px;border-radius:8px;border:1px solid var(--ln);background:rgba(255,255,255,.04);color:var(--mu);font:800 15px var(--disp)}.lvc button.on{border-color:var(--acc);color:var(--acc-t);background:var(--acc)}
.rt h3{font-size:14px;color:var(--mu);margin-bottom:10px;font-weight:600}
#totalT{margin-top:12px;font-size:13.5px;color:var(--hi);font-weight:600}
.note{margin-top:16px;font-size:12.5px;color:#7f8fae;line-height:1.55;max-width:60ch}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
